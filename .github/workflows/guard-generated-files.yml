name: Guard generated files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    # release-please owns CHANGELOG.md and .release-please-manifest.json; its PR
    # is the one legitimate place those files change, so we exempt its author.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      - name: Check PR does not modify release-please-generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPSTREAM_URL: https://github.com/kunchenguid/no-mistakes.git
          UPSTREAM_BRANCH: main
        run: |
          set -eu
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          changed=""
          for path in CHANGELOG.md .release-please-manifest.json; do
            if printf '%s\n' "$files" | grep -qxF -- "$path"; then
              changed="${changed} ${path}"
            fi
          done

          violated=""
          if [ -n "$changed" ]; then
            # An upgrade PR that rebases this fork onto a newer upstream release
            # carries upstream's OWN release-please commits, and those commits are
            # exactly what writes these files. That is not a hand edit, and every
            # future upgrade would trip this guard identically. So accept one
            # extra case: each changed file is byte-identical to the same file at
            # the upstream commit this branch is built on.
            #
            # The comparison point is the MERGE BASE with upstream's default
            # branch, deliberately not upstream's tip: comparing against the tip
            # would start failing the moment upstream cut its next release, for a
            # branch nobody had touched. Do not "simplify" this to the tip.
            git remote add upstream-guard "$UPSTREAM_URL" 2>/dev/null \
              || git remote set-url upstream-guard "$UPSTREAM_URL"
            if ! git fetch --quiet upstream-guard "$UPSTREAM_BRANCH"; then
              echo "::error::cannot fetch ${UPSTREAM_URL} ${UPSTREAM_BRANCH} to verify generated files against upstream" >&2
              exit 1
            fi
            if ! upstream_base=$(git merge-base "${HEAD_SHA}" FETCH_HEAD); then
              echo "::error::no common history with ${UPSTREAM_URL} ${UPSTREAM_BRANCH}; cannot verify generated files against upstream" >&2
              exit 1
            fi
            echo "Comparing changed generated files against upstream commit ${upstream_base}."
            for path in $changed; do
              if git diff --quiet "${upstream_base}" "${HEAD_SHA}" -- "$path"; then
                echo "  ${path}: unchanged from upstream. OK."
              else
                violated="${violated} ${path}"
              fi
            done
          fi

          if [ -n "$violated" ]; then
            {
              echo "::error::This PR modifies release-please-generated files:${violated}"
              echo
              echo "CHANGELOG.md and .release-please-manifest.json are auto-generated by"
              echo "release-please from conventional commits on main. Do not hand-edit them."
              echo
              echo "These files differ from the upstream commit this branch is built on,"
              echo "so they were not carried in unchanged by an upstream release commit."
              echo
              echo "If you want your change to appear in the next release notes, use a"
              echo "conventional commit message (feat/fix/docs/...). release-please will"
              echo "update these files in the next release PR automatically."
              echo
              echo "See CONTRIBUTING.md for the full contributor workflow."
            } >&2
            exit 1
          fi

          if [ -n "$changed" ]; then
            echo "Release-please-generated files changed, but every one is unchanged from upstream. OK."
          else
            echo "No release-please-generated files modified. OK."
          fi
